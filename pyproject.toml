[project]
name = "study-kit"
version = "0.1.2"
description = "Run many small research studies: provenance-tracked data, a static app per study, one-command deploys."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
study-kit = "study_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_toolkit", "src/study_kit"]

[tool.hatch.build.targets.wheel.force-include]
"GUIDE.md" = "study_kit/GUIDE.md"
"claude" = "study_kit/claude"
